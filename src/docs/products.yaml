paths:
  /api/products/available:
    get:
      tags:
        - Products
      summary: Listar productos disponibles
      description: Devuelve de forma paginada únicamente los productos cuyo estado es AVAILABLE.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Lista de productos disponibles obtenida correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - products
                          - pagination
                        properties:
                          products:
                            type: array
                            items:
                              $ref: '#/components/schemas/Product'
                          pagination:
                            $ref: '#/components/schemas/PaginationMetadata'
        '400':
          description: INVALID_PAGINATION - Parámetros de paginación inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: INTERNAL_SERVER_ERROR - Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/products:
    get:
      tags:
        - Products
      summary: Listar productos
      description: Devuelve productos paginados y permite filtrar por disponibilidad.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: status
          in: query
          required: false
          description: Estado de disponibilidad del producto
          schema:
            type: string
            enum:
              - AVAILABLE
              - OUT_OF_STOCK
      responses:
        '200':
          description: Lista de productos obtenida correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - products
                          - pagination
                        properties:
                          products:
                            type: array
                            items:
                              $ref: '#/components/schemas/Product'
                          pagination:
                            $ref: '#/components/schemas/PaginationMetadata'
        '400':
          description: INVALID_PAGINATION o INVALID_FILTER - Parámetros de consulta inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: INTERNAL_SERVER_ERROR - Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Products
      summary: Crear un producto
      description: Crea un producto y calcula automáticamente su estado según el stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - price
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
                price:
                  type: number
                  minimum: 0
                stock:
                  type: integer
                  minimum: 0
                  default: 0
            example:
              name: Teclado mecanico
              description: Teclado para escritorio
              price: 25000
              stock: 10
      responses:
        '201':
          description: Producto creado correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - product
                        properties:
                          product:
                            $ref: '#/components/schemas/Product'
        '400':
          description: VALIDATION_ERROR - Los datos enviados no son válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          description: INTERNAL_SERVER_ERROR - Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/products/{id}:
    get:
      tags:
        - Products
      summary: Obtener un producto por ID
      description: Devuelve el producto indicado.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del producto
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Producto obtenido correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - product
                        properties:
                          product:
                            $ref: '#/components/schemas/Product'
        '400':
          description: INVALID_ID - El identificador no tiene un formato válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: PRODUCT_NOT_FOUND - El producto no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: INTERNAL_SERVER_ERROR - Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Products
      summary: Actualizar un producto
      description: Actualiza uno o más campos y recalcula el estado según el stock resultante.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del producto
          schema:
            $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
                price:
                  type: number
                  minimum: 0
                stock:
                  type: integer
                  minimum: 0
            example:
              price: 27000
              stock: 7
      responses:
        '200':
          description: Producto actualizado correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - product
                        properties:
                          product:
                            $ref: '#/components/schemas/Product'
        '400':
          description: INVALID_ID o VALIDATION_ERROR - Identificador o datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '404':
          description: PRODUCT_NOT_FOUND - El producto no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: INTERNAL_SERVER_ERROR - Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Products
      summary: Eliminar un producto
      description: Elimina definitivamente el producto indicado.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del producto
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '204':
          description: Producto eliminado correctamente, sin contenido
        '400':
          description: INVALID_ID - El identificador no tiene un formato válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: PRODUCT_NOT_FOUND - El producto no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: INTERNAL_SERVER_ERROR - Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
