paths:
  /api/mocks/mockingusers:
    get:
      tags:
        - Mocks
      summary: Generar usuarios mock
      description: Genera usuarios sin guardarlos. Esta ruta solo está disponible con NODE_ENV=development.
      parameters:
        - name: qty
          in: query
          required: false
          description: Cantidad de usuarios a generar
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Usuarios mock generados correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - users
                        properties:
                          users:
                            type: array
                            items:
                              $ref: '#/components/schemas/User'
        '400':
          description: INVALID_MOCK_AMOUNT - La cantidad debe ser un entero entre 1 y 100
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: INTERNAL_SERVER_ERROR - Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/mocks/mockingorders:
    get:
      tags:
        - Mocks
      summary: Generar pedidos mock
      description: Genera pedidos con items y usuarios simulados sin guardarlos. Solo está disponible en desarrollo.
      parameters:
        - name: qty
          in: query
          required: false
          description: Cantidad de pedidos a generar
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Pedidos mock generados correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - orders
                        properties:
                          orders:
                            type: array
                            items:
                              type: object
                              required:
                                - user
                                - deliveryAddress
                                - items
                                - status
                                - priority
                              properties:
                                user:
                                  $ref: '#/components/schemas/ObjectId'
                                deliveryAddress:
                                  type: string
                                items:
                                  type: array
                                  minItems: 1
                                  items:
                                    $ref: '#/components/schemas/OrderItem'
                                status:
                                  type: string
                                  enum:
                                    - created
                                    - assigned
                                    - picked_up
                                    - in_transit
                                    - delivered
                                    - cancelled
                                priority:
                                  type: string
                                  enum:
                                    - low
                                    - normal
                                    - high
        '400':
          description: INVALID_MOCK_AMOUNT - La cantidad debe ser un entero entre 1 y 100
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: INTERNAL_SERVER_ERROR - Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/mocks/generate-products:
    post:
      tags:
        - Mocks
      summary: Generar productos mock
      description: Genera productos y opcionalmente los guarda en MongoDB. Solo está disponible en desarrollo.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                count:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 10
                saveToDatabase:
                  type: boolean
                  default: false
            example:
              count: 10
              saveToDatabase: false
      responses:
        '200':
          description: Productos generados sin guardar en MongoDB
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/MockProductsResult'
        '201':
          description: Productos generados y guardados en MongoDB
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/MockProductsResult'
        '400':
          description: INVALID_MOCK_AMOUNT o INVALID_MOCK_DATA - Cantidad u opción de guardado inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidAmount:
                  value:
                    status: error
                    error: INVALID_MOCK_AMOUNT
                    message: La cantidad debe ser un número entero entre 1 y 100
                invalidData:
                  value:
                    status: error
                    error: INVALID_MOCK_DATA
                    message: saveToDatabase debe ser un valor booleano
        '500':
          description: MOCK_GENERATION_ERROR o INTERNAL_SERVER_ERROR - Falló la generación o carga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/mocks/generateData:
    post:
      tags:
        - Mocks
      summary: Insertar datos mock relacionados
      description: Inserta usuarios, pedidos y entregas respetando sus relaciones. Solo está disponible en desarrollo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - users
                - orders
                - deliveries
              properties:
                users:
                  type: integer
                  minimum: 0
                  maximum: 100
                orders:
                  type: integer
                  minimum: 0
                  maximum: 100
                deliveries:
                  type: integer
                  minimum: 0
                  maximum: 100
            example:
              users: 10
              orders: 20
              deliveries: 5
      responses:
        '201':
          description: Datos relacionados insertados correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - inserted
                        properties:
                          inserted:
                            type: object
                            required:
                              - users
                              - customers
                              - drivers
                              - orders
                              - deliveries
                            properties:
                              users:
                                type: integer
                                minimum: 0
                              customers:
                                type: integer
                                minimum: 0
                              drivers:
                                type: integer
                                minimum: 0
                              orders:
                                type: integer
                                minimum: 0
                              deliveries:
                                type: integer
                                minimum: 0
        '400':
          description: INVALID_MOCK_DATA - Cantidades o relaciones entre datos inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidAmount:
                  value:
                    status: error
                    error: INVALID_MOCK_DATA
                    message: users, orders y deliveries deben ser números enteros entre 0 y 100
                invalidRelation:
                  value:
                    status: error
                    error: INVALID_MOCK_DATA
                    message: Para generar pedidos también deben generarse usuarios
        '500':
          description: MOCK_GENERATION_ERROR o INTERNAL_SERVER_ERROR - Falló la generación o carga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    MockProduct:
      type: object
      required:
        - name
        - description
        - price
        - stock
        - status
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          example: Teclado mecanico
        description:
          type: string
          example: Teclado para escritorio
        price:
          type: number
          minimum: 0
          example: 25000
        stock:
          type: integer
          minimum: 0
          example: 10
        status:
          type: string
          enum:
            - AVAILABLE
            - OUT_OF_STOCK

    MockProductsResult:
      type: object
      required:
        - products
        - savedToDatabase
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/MockProduct'
        savedToDatabase:
          type: boolean
          example: false
