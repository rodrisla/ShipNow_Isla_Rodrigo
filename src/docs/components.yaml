components:
  schemas:
    ObjectId:
      type: string
      pattern: '^[a-fA-F0-9]{24}$'
      example: 6a94b5b0befa1cbb83815663

    SuccessResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - success
          example: success

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: string
          enum:
            - error
          example: error
        error:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Los datos enviados no son válidos

    PaginationMetadata:
      type: object
      required:
        - page
        - limit
        - total
        - totalPages
        - hasNextPage
        - hasPreviousPage
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          example: 10
        total:
          type: integer
          minimum: 0
          example: 25
        totalPages:
          type: integer
          minimum: 0
          example: 3
        hasNextPage:
          type: boolean
          example: true
        hasPreviousPage:
          type: boolean
          example: false

    HealthResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          enum:
            - success
        data:
          type: object
          required:
            - service
            - api
            - environment
            - uptime
            - timestamp
          properties:
            service:
              type: string
              example: ShipNow API
            api:
              type: string
              enum:
                - up
            environment:
              type: string
              enum:
                - development
                - test
                - production
            uptime:
              type: number
              minimum: 0
              example: 35.217
            timestamp:
              type: string
              format: date-time

    FileMetadata:
      type: object
      required:
        - originalName
        - storedName
        - path
        - mimeType
        - size
        - documentType
        - uploadedAt
      properties:
        originalName:
          type: string
          example: dni-usuario.pdf
        storedName:
          type: string
          example: 1788230271701-8a291d89-3861-491e-bdb5-4566c0a3bad0.pdf
        path:
          type: string
          example: uploads/users/documents/1788230271701-archivo.pdf
        mimeType:
          type: string
          enum:
            - application/pdf
            - image/jpeg
            - image/png
          example: application/pdf
        size:
          type: integer
          minimum: 1
          maximum: 5242880
          example: 2048
        documentType:
          type: string
          enum:
            - dni
            - driver_license
            - insurance
            - delivery_receipt
          example: dni
        uploadedAt:
          type: string
          format: date-time

    User:
      type: object
      required:
        - _id
        - name
        - email
        - role
        - active
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Ana Pérez
        email:
          type: string
          format: email
          example: ana@shipnow.test
        role:
          type: string
          enum:
            - admin
            - customer
            - driver
            - store
          example: customer
        active:
          type: boolean
          example: true
        documents:
          type: array
          description: Metadatos de los documentos asociados al usuario
          items:
            $ref: "#/components/schemas/FileMetadata"
          default: []
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Product:
      type: object
      required:
        - _id
        - name
        - price
        - stock
        - status
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Teclado mecánico
        description:
          type: string
          maxLength: 500
          example: Teclado para escritorio
        price:
          type: number
          minimum: 0
          example: 25000
        stock:
          type: integer
          minimum: 0
          example: 10
        status:
          type: string
          enum:
            - AVAILABLE
            - OUT_OF_STOCK
          example: AVAILABLE
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderItem:
      type: object
      required:
        - name
        - quantity
        - price
      properties:
        name:
          type: string
          example: Teclado mecánico
        quantity:
          type: integer
          minimum: 1
          example: 2
        price:
          type: number
          minimum: 0
          example: 25000

    Order:
      type: object
      required:
        - _id
        - user
        - deliveryAddress
        - items
        - status
        - priority
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        user:
          oneOf:
            - $ref: '#/components/schemas/User'
            - $ref: '#/components/schemas/ObjectId'
        deliveryAddress:
          type: string
          example: Av. Corrientes 1234
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        status:
          type: string
          enum:
            - created
            - assigned
            - picked_up
            - in_transit
            - delivered
            - cancelled
          example: created
        priority:
          type: string
          enum:
            - low
            - normal
            - high
          example: normal
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Delivery:
      type: object
      required:
        - _id
        - order
        - status
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        order:
          oneOf:
            - $ref: '#/components/schemas/Order'
            - $ref: '#/components/schemas/ObjectId'
        driver:
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/User'
            - $ref: '#/components/schemas/ObjectId'
        status:
          type: string
          enum:
            - pending
            - assigned
            - picked_up
            - in_transit
            - delivered
            - cancelled
          example: pending
        receipts:
          type: array
          description: Metadatos de los comprobantes asociados a la entrega
          items:
            $ref: "#/components/schemas/FileMetadata"
          default: []
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

  parameters:
    PageQuery:
      name: page
      in: query
      required: false
      description: Número de página solicitado
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitQuery:
      name: limit
      in: query
      required: false
      description: Cantidad solicitada por página. Los valores mayores a 100 se limitan automáticamente a 100.
      schema:
        type: integer
        minimum: 1
        default: 10

  responses:
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE - El cuerpo JSON supera el límite de 100 KB
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
