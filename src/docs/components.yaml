components:
  schemas:
    ObjectId:
      type: string
      pattern: '^[a-fA-F0-9]{24}$'
      example: 6a94b5b0befa1cbb83815663

    SuccessResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - success
          example: success

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: string
          enum:
            - error
          example: error
        error:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Los datos enviados no son válidos

    User:
      type: object
      required:
        - _id
        - name
        - email
        - role
        - active
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Ana Pérez
        email:
          type: string
          format: email
          example: ana@shipnow.test
        role:
          type: string
          enum:
            - admin
            - customer
            - driver
            - store
          example: customer
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Product:
      type: object
      required:
        - _id
        - name
        - price
        - stock
        - status
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Teclado mecánico
        description:
          type: string
          maxLength: 500
          example: Teclado para escritorio
        price:
          type: number
          minimum: 0
          example: 25000
        stock:
          type: integer
          minimum: 0
          example: 10
        status:
          type: string
          enum:
            - AVAILABLE
            - OUT_OF_STOCK
          example: AVAILABLE
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderItem:
      type: object
      required:
        - name
        - quantity
        - price
      properties:
        name:
          type: string
          example: Teclado mecánico
        quantity:
          type: integer
          minimum: 1
          example: 2
        price:
          type: number
          minimum: 0
          example: 25000

    Order:
      type: object
      required:
        - _id
        - user
        - deliveryAddress
        - items
        - status
        - priority
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        user:
          oneOf:
            - $ref: '#/components/schemas/User'
            - $ref: '#/components/schemas/ObjectId'
        deliveryAddress:
          type: string
          example: Av. Corrientes 1234
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        status:
          type: string
          enum:
            - created
            - assigned
            - picked_up
            - in_transit
            - delivered
            - cancelled
          example: created
        priority:
          type: string
          enum:
            - low
            - normal
            - high
          example: normal
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Delivery:
      type: object
      required:
        - _id
        - order
        - status
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        order:
          oneOf:
            - $ref: '#/components/schemas/Order'
            - $ref: '#/components/schemas/ObjectId'
        driver:
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/User'
            - $ref: '#/components/schemas/ObjectId'
        status:
          type: string
          enum:
            - pending
            - assigned
            - picked_up
            - in_transit
            - delivered
            - cancelled
          example: pending
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
