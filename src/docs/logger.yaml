paths:
  /logger-test:
    get:
      tags:
        - Logger
      summary: Probar todos los niveles del logger
      description: Herramienta interna de validación. Genera logs debug, http, info, warning, error y fatal; no representa una funcionalidad de negocio.
      responses:
        '200':
          description: Todos los niveles del logger fueron ejecutados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - message
                    properties:
                      message:
                        type: string
                        example: Todos los niveles del logger fueron ejecutados
        '500':
          description: INTERNAL_SERVER_ERROR - Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
